# .gitlab-ci.yml
# GitLab CI pipeline
#
# Stage:
#   docker  - one Docker build that compiles, tests, and packages.

stages:
  - docker

docker-build:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_BUILDKIT: "1"
  cache:
    key:
      files:
        - Dockerfile
        - conanfile.py
      prefix: "docker"
    paths:
      - .buildx-cache
    policy: pull-push
  script:
    - docker info
    - docker context inspect ci-context >/dev/null 2>&1 || docker context create ci-context --docker "host=${DOCKER_HOST},ca=${DOCKER_CERT_PATH}/ca.pem,cert=${DOCKER_CERT_PATH}/cert.pem,key=${DOCKER_CERT_PATH}/key.pem"
    - docker buildx create --name ci-builder --use ci-context || docker buildx use ci-builder
    - docker buildx build
        --platform linux/amd64
        --cache-from type=local,src=.buildx-cache
        --cache-to   type=local,dest=.buildx-cache-new,mode=max
        --target final
        -t hello-service:ci
        --load
        .
    - rm -rf .buildx-cache
    - mv .buildx-cache-new .buildx-cache
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
